name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          echo "Checking index.html..."
          test -f index.html
          echo "index.html exists"

      - name: CI Success
        run: echo "CI PIPELINE SUCCESS"